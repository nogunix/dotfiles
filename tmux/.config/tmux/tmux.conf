##### General #####
set -g escape-time 50
set -g mouse on
# Toggle mouse mode with prefix+m
bind-key m if -F "#{?mouse,1,0}" "set -g mouse off \; display-message 'Mouse mode: off'" "set -g mouse on \; display-message 'Mouse mode: on'"
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Terminal settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-passthrough on
set -g default-shell /bin/zsh
set -ga update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY"

# Tokyo Night theme pane borders
set -g pane-border-style "fg=#2A2F41"
set -g pane-active-border-style "fg=#7aa2f7"

# Copy mode style
set -g mode-style "bg=#7aa2f7,fg=#c0caf5"

# Status bar is rendered by tmux-powerline (Plugins section at the bottom).
# Colors/segments live in ~/.config/tmux-powerline/config.sh and reproduce the
# original hand-written look. Only keep position here.
set -g status-position bottom

# Pin the base status styles to the bar bg so the #[default] resets inside
# tmux-powerline's segment strings fall back to #2A2F41 — not the terminal
# default (black). Without this the powerline separators render on black.
set -g status-left-style "bg=#2A2F41,fg=#c0caf5"
set -g status-right-style "bg=#2A2F41,fg=#c0caf5"
set -g window-status-style "bg=#2A2F41,fg=#c0caf5"
set -g window-status-current-style "bg=#2A2F41,fg=#c0caf5"

##### Clipboard (`clip` 経由でローカル端末へ) #####
set -g set-clipboard on
set -s copy-command '/home/mnoguchi/.local/bin/clip'

# Pipe copy-mode selections into `clip`
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel '/home/mnoguchi/.local/bin/clip'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel '/home/mnoguchi/.local/bin/clip'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '/home/mnoguchi/.local/bin/clip'
bind-key -T copy-mode Enter send -X copy-pipe-and-cancel '/home/mnoguchi/.local/bin/clip'
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel '/home/mnoguchi/.local/bin/clip'

# Scroll operation as usual
bind -n WheelUpPane send-keys -M
bind -n WheelDownPane if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'

# * Reference for direct Wayland (e.g., when using reverse SSH to call local wl-copy):
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

##### Reload #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

##### Plugins (TPM) #####
# Keep plugins out of the stow-managed config dir by storing them under the
# data dir instead of the default ~/.config/tmux/plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'erikw/tmux-powerline'

# Initialize TPM — keep this line at the very bottom of tmux.conf.
run '~/.local/share/tmux/plugins/tpm/tpm'
