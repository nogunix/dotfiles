##### General #####
set -g escape-time 50
set -g mouse on
# Toggle mouse mode with prefix+m
bind-key m if -F "#{?mouse,1,0}" "set -g mouse off \; display-message 'Mouse mode: off'" "set -g mouse on \; display-message 'Mouse mode: on'"
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Terminal settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-passthrough on
set -g default-shell /bin/zsh
set -ga update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY"

# Tokyo Night theme pane borders
set -g pane-border-style "fg=#2A2F41"
set -g pane-active-border-style "fg=#7aa2f7"

# Copy mode style
set -g mode-style "bg=#7aa2f7,fg=#c0caf5"

##### Status bar #####
# Rendered natively by tmux. Every piece below is a plain format string, so a
# redraw forks nothing — the one exception is the git chip, which runs a small
# script once per status-interval (see git-branch.sh).
#
# Palette: Tokyo Night. The %hidden variables keep the long format strings
# readable and define each colour exactly once.
%hidden TN_BLUE="#7aa2f7"    # outer chips
%hidden TN_GRAY="#414868"    # inner chips
%hidden TN_BAR="#2A2F41"     # bar background
%hidden TN_FG="#c0caf5"      # foreground

# Nerd Font glyphs: powerline separators (U+E0B0, U+E0B2) and branch (U+E0A0).
%hidden SEP_R=""
%hidden SEP_L=""
%hidden GIT_SYM=""

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 150
set -g status-right-length 100

# The `#[default]` resets inside the formats below fall back to these styles,
# so pin them to the bar background — otherwise the separators, whose fg is a
# chip colour and whose bg is the bar, would render on the terminal's black.
set -g status-style "fg=${TN_FG},bg=${TN_BAR}"
set -g status-left-style "bg=${TN_BAR},fg=${TN_FG}"
set -g status-right-style "bg=${TN_BAR},fg=${TN_FG}"
set -gw window-status-style "bg=${TN_BAR},fg=${TN_FG}"
set -gw window-status-current-style "bg=${TN_BAR},fg=${TN_FG}"

# Window list: hidden. A bare style directive renders nothing.
set -gw window-status-separator ""
set -gw window-status-format "#[default]"
set -gw window-status-current-format "#[default]"

# Left: session chip (blue) | OS chip (gray).
# The kernel version cannot change while the server is up, so resolve it once
# at config load and keep it in a user option instead of forking for it.
run 'tmux set -g @os_label "$(~/.config/tmux/os-label.sh)"'
set -g status-left "#[fg=${TN_BAR},bg=${TN_BLUE}] [#S] #I:#W #[default]#[fg=${TN_BLUE},bg=${TN_GRAY}]${SEP_R}#[default]#[fg=${TN_FG},bg=${TN_GRAY}] #{@os_label} #[default]#[fg=${TN_GRAY},bg=${TN_BAR}]${SEP_R}#[default]"

# Right: git branch chip (gray, only inside a repo) | pane path chip (blue).
# git-branch.sh prints the three user options below and tmux expands them in
# turn, which keeps the palette here rather than duplicated in the script.
set -g @git_pre "#[fg=${TN_GRAY},bg=${TN_BAR}]${SEP_L}#[default]#[fg=${TN_FG},bg=${TN_GRAY}] ${GIT_SYM} "
set -g @git_post " #[default]#[fg=${TN_BLUE},bg=${TN_GRAY}]${SEP_L}#[default]"
set -g @git_none "#[fg=${TN_BLUE},bg=${TN_BAR}]${SEP_L}#[default]"
set -g status-right "#(~/.config/tmux/git-branch.sh #{q:pane_current_path})#[fg=${TN_BAR},bg=${TN_BLUE}] #{pane_current_path} #[default]"

##### Clipboard (`clip` 経由でローカル端末へ) #####
set -g set-clipboard on
set -s copy-command "$HOME/.local/bin/clip"

# Pipe copy-mode selections into `clip`
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/.local/bin/clip"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "$HOME/.local/bin/clip"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.local/bin/clip"
bind-key -T copy-mode Enter send -X copy-pipe-and-cancel "$HOME/.local/bin/clip"
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/.local/bin/clip"

# Scroll operation as usual
bind -n WheelUpPane send-keys -M
bind -n WheelDownPane if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'

# * Reference for direct Wayland (e.g., when using reverse SSH to call local wl-copy):
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

##### Reload #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"
